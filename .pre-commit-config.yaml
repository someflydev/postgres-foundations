repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.35.1
    hooks:
      - id: yamllint
        files: ^(\.github/workflows/.*\.ya?ml|docker/.*\.ya?ml|.*compose.*\.ya?ml)$
        args:
          - -d
          - "{extends: default, rules: {line-length: {max: 120}, truthy: disable, document-start: disable}}"
  - repo: local
    hooks:
      - id: pgfound-content-validate
        name: pgfound content validate staged files
        entry: scripts/precommit-content-validate.sh
        language: script
        files: ^((curriculum/(map|admin/map|extensions/map)\.json)|(lessons/.*/lesson\.json)|(exercises/.*/exercise\.json)|(rubrics/.*/[^/]+\.json)|(scenarios/industries/.*/scenario\.json)|(scenarios/interviews/.*\.ya?ml)|(capstones/.*/capstone\.json))$
        pass_filenames: true
      - id: pgfound-docs-check
        name: pgfound docs check staged markdown
        entry: scripts/precommit-docs-check.sh
        language: script
        files: \.md$
        pass_filenames: true
