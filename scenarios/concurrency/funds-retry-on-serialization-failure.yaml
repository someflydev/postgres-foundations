name: funds-retry-on-serialization-failure
sessions:
  A: {role: pgfound, database: pgfound}
  B: {role: pgfound, database: pgfound}
setup_sql: |
  CREATE SCHEMA IF NOT EXISTS pgfound_harness;
  DROP TABLE IF EXISTS pgfound_harness.transfer_requests;
  DROP TABLE IF EXISTS pgfound_harness.accounts;
  CREATE TABLE pgfound_harness.accounts (
      id integer PRIMARY KEY,
      balance numeric(12,2) NOT NULL
  );
  CREATE TABLE pgfound_harness.transfer_requests (
      idempotency_key text PRIMARY KEY,
      account_id integer NOT NULL REFERENCES pgfound_harness.accounts(id),
      amount numeric(12,2) NOT NULL
  );
  INSERT INTO pgfound_harness.accounts VALUES (1, 100.00);
steps:
  - session: A
    sql: "BEGIN ISOLATION LEVEL SERIALIZABLE;"
  - session: B
    sql: "BEGIN ISOLATION LEVEL SERIALIZABLE;"
  - session: A
    sql: "SELECT balance::text AS balance FROM pgfound_harness.accounts WHERE id = 1;"
    expect:
      rows: [{balance: "100.00"}]
  - session: B
    sql: "SELECT balance::text AS balance FROM pgfound_harness.accounts WHERE id = 1;"
    expect:
      rows: [{balance: "100.00"}]
  - session: A
    sql: "UPDATE pgfound_harness.accounts SET balance = balance - 10 WHERE id = 1; INSERT INTO pgfound_harness.transfer_requests VALUES ('retry-key', 1, 10);"
    expect:
      rowcount: 1
  - session: A
    sql: "COMMIT;"
  - session: B
    sql: "UPDATE pgfound_harness.accounts SET balance = balance - 10 WHERE id = 1; INSERT INTO pgfound_harness.transfer_requests VALUES ('retry-key', 1, 10);"
    expect:
      error_code: "40001"
  - session: B
    sql: "ROLLBACK;"
  - session: B
    sql: "BEGIN;"
  - session: B
    sql: "INSERT INTO pgfound_harness.transfer_requests VALUES ('retry-key', 1, 10) ON CONFLICT (idempotency_key) DO NOTHING;"
    expect:
      rowcount: 0
  - session: B
    sql: "COMMIT;"
  - session: A
    sql: "SELECT balance::text AS balance FROM pgfound_harness.accounts WHERE id = 1;"
    expect:
      rows: [{balance: "90.00"}]
teardown_sql: |
  DROP TABLE IF EXISTS pgfound_harness.transfer_requests;
  DROP TABLE IF EXISTS pgfound_harness.accounts;
