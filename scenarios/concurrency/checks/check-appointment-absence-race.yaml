name: check-appointment-absence-race
sessions:
  A: {role: pgfound, database: pgfound}
  B: {role: pgfound, database: pgfound}
setup_sql: |
  CREATE SCHEMA IF NOT EXISTS pgfound_harness;
  DROP TABLE IF EXISTS pgfound_harness.appointment_holds;
  CREATE TABLE pgfound_harness.appointment_holds (
      id bigint generated always as identity PRIMARY KEY,
      professional_id integer NOT NULL,
      slot tstzrange NOT NULL
  );
steps:
  - session: A
    sql: "BEGIN;"
  - session: B
    sql: "BEGIN;"
  - session: A
    sql: "${LEARNER_SQL}"
    expect:
      rows: [{overlapping: 0}]
  - session: B
    sql: "SELECT count(*)::int AS overlapping FROM pgfound_harness.appointment_holds WHERE professional_id = 1 AND slot && tstzrange('2026-05-10 15:00:00+00', '2026-05-10 15:30:00+00', '[)');"
    expect:
      rows: [{overlapping: 0}]
  - session: A
    sql: "INSERT INTO pgfound_harness.appointment_holds (professional_id, slot) VALUES (1, tstzrange('2026-05-10 15:00:00+00', '2026-05-10 15:30:00+00', '[)'));"
    expect:
      rowcount: 1
  - session: B
    sql: "INSERT INTO pgfound_harness.appointment_holds (professional_id, slot) VALUES (1, tstzrange('2026-05-10 15:00:00+00', '2026-05-10 15:30:00+00', '[)'));"
    expect:
      rowcount: 1
  - session: A
    sql: "COMMIT;"
  - session: B
    sql: "COMMIT;"
  - session: A
    sql: "SELECT count(*)::int AS holds FROM pgfound_harness.appointment_holds;"
    expect:
      rows: [{holds: 2}]
teardown_sql: |
  DROP TABLE IF EXISTS pgfound_harness.appointment_holds;
