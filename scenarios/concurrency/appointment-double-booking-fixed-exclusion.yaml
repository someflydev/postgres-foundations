name: appointment-double-booking-fixed-exclusion
sessions:
  A: {role: pgfound, database: pgfound}
  B: {role: pgfound, database: pgfound}
setup_sql: |
  CREATE SCHEMA IF NOT EXISTS pgfound_harness;
  DROP TABLE IF EXISTS pgfound_harness.appointment_holds;
  CREATE TABLE pgfound_harness.appointment_holds (
      id bigint generated always as identity PRIMARY KEY,
      professional_id integer NOT NULL,
      slot_start timestamptz NOT NULL,
      slot_end timestamptz NOT NULL,
      UNIQUE (professional_id, slot_start)
  );
steps:
  - session: A
    sql: "BEGIN;"
  - session: B
    sql: "BEGIN;"
  - session: A
    sql: "INSERT INTO pgfound_harness.appointment_holds (professional_id, slot_start, slot_end) VALUES (1, '2026-05-10 15:00+00', '2026-05-10 15:30+00');"
    expect:
      rowcount: 1
  - session: A
    sql: "COMMIT;"
  - session: B
    sql: "INSERT INTO pgfound_harness.appointment_holds (professional_id, slot_start, slot_end) VALUES (1, '2026-05-10 15:00+00', '2026-05-10 15:30+00');"
    expect:
      error_code: "23505"
  - session: B
    sql: "ROLLBACK;"
  - session: A
    sql: "SELECT count(*)::int AS holds FROM pgfound_harness.appointment_holds;"
    expect:
      rows: [{holds: 1}]
teardown_sql: |
  DROP TABLE IF EXISTS pgfound_harness.appointment_holds;
