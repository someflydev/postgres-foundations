[project]
name = "pgfound"
version = "0.0.1"
description = "PostgreSQL foundations training lab and planning engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.0.0",
    "psycopg>=3.2.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
]

[project.scripts]
pgfound = "pgfound.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
markers = [
    "docker: tests that require the PostgreSQL Docker lab",
]
