name: postgres-foundations

services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgfound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgfound}
      POSTGRES_DB: ${POSTGRES_DB:-pgfound}
    ports:
      - "${POSTGRES_PORT:-55433}:5432"
    volumes:
      - pgfound-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgfound -d pgfound"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - pgfound-net

  pg-hba-overlay:
    image: postgres:16
    profiles:
      - hba_overlay
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgfound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgfound}
      POSTGRES_DB: ${POSTGRES_DB:-pgfound}
    ports:
      - "${POSTGRES_HBA_OVERLAY_PORT:-55435}:5432"
    volumes:
      - pgfound-hba-overlay-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./hba_overlay/pg_hba.conf:/etc/postgresql/pg_hba_overlay.conf:ro
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba_overlay.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - wal_level=logical
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgfound -d pgfound"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - pgfound-net

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p0
    profiles:
      - pooling
    depends_on:
      pg:
        condition: service_healthy
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U pgfound -d pgfound"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - pgfound-net

  postgis:
    image: postgis/postgis:16-3.4
    profiles:
      - postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgfound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgfound}
      POSTGRES_DB: ${POSTGRES_DB:-pgfound}
    ports:
      - "${POSTGIS_PORT:-5436}:5432"
    volumes:
      - pgfound-postgis-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgfound -d pgfound"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - pgfound-net

  pgvector:
    image: pgvector/pgvector:pg16
    profiles:
      - pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgfound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgfound}
      POSTGRES_DB: ${POSTGRES_DB:-pgfound}
    ports:
      - "${PGVECTOR_PORT:-5437}:5432"
    volumes:
      - pgfound-pgvector-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgfound -d pgfound"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - pgfound-net

  timescale:
    image: timescale/timescaledb:2.15.3-pg16
    profiles:
      - timescale
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgfound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgfound}
      POSTGRES_DB: ${POSTGRES_DB:-pgfound}
    ports:
      - "${TIMESCALE_PORT:-5438}:5432"
    volumes:
      - pgfound-timescale-data:/var/lib/postgresql/data
      - ./initdb-timescale:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgfound -d pgfound"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - pgfound-net

  citus-worker-1:
    image: citusdata/citus:12.1
    profiles:
      - citus
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgfound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgfound}
      POSTGRES_DB: ${POSTGRES_DB:-pgfound}
    volumes:
      - pgfound-citus-worker-1-data:/var/lib/postgresql/data
      - ./initdb-citus-worker:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgfound -d pgfound"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - pgfound-net

  citus-worker-2:
    image: citusdata/citus:12.1
    profiles:
      - citus
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgfound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgfound}
      POSTGRES_DB: ${POSTGRES_DB:-pgfound}
    volumes:
      - pgfound-citus-worker-2-data:/var/lib/postgresql/data
      - ./initdb-citus-worker:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgfound -d pgfound"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - pgfound-net

  citus-coordinator:
    image: citusdata/citus:12.1
    profiles:
      - citus
    depends_on:
      citus-worker-1:
        condition: service_healthy
      citus-worker-2:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgfound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgfound}
      POSTGRES_DB: ${POSTGRES_DB:-pgfound}
    ports:
      - "${CITUS_PORT:-5439}:5432"
    volumes:
      - pgfound-citus-coordinator-data:/var/lib/postgresql/data
      - ./initdb-citus:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgfound -d pgfound"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - pgfound-net

  pgpartman:
    build:
      context: ./pg-with-partman
    profiles:
      - pgpartman
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgfound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgfound}
      POSTGRES_DB: ${POSTGRES_DB:-pgfound}
    ports:
      - "${PGPARTMAN_PORT:-5440}:5432"
    volumes:
      - pgfound-pgpartman-data:/var/lib/postgresql/data
      - ./initdb-pgpartman:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_partman_bgw,pg_stat_statements
      - -c
      - pg_partman_bgw.dbname=pgfound
      - -c
      - wal_level=logical
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=200
      - -c
      - pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgfound -d pgfound"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - pgfound-net

  pg-sandbox:
    image: postgres:16
    profiles:
      - sandbox
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgfound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgfound}
      POSTGRES_DB: ${POSTGRES_DB:-pgfound}
    ports:
      - "${POSTGRES_SANDBOX_PORT:-55434}:5432"
    volumes:
      - /var/lib/postgresql/data
    networks:
      - pgfound-net

  pg-replica:
    image: postgres:16
    profiles:
      - replication
    environment:
      POSTGRES_USER: ${POSTGRES_REPLICA_USER:-pgfound}
      POSTGRES_PASSWORD: ${POSTGRES_REPLICA_PASSWORD:-pgfound}
      POSTGRES_DB: ${POSTGRES_REPLICA_DB:-pgfound}
    ports:
      - "${POSTGRES_REPLICA_PORT:-5435}:5432"
    volumes:
      - pgfound-replica-data:/var/lib/postgresql/data
      - ./initdb-replica:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgfound -d pgfound"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - pgfound-net

networks:
  pgfound-net:

volumes:
  pgfound-data:
  pgfound-hba-overlay-data:
  pgfound-postgis-data:
  pgfound-pgvector-data:
  pgfound-timescale-data:
  pgfound-citus-coordinator-data:
  pgfound-citus-worker-1-data:
  pgfound-citus-worker-2-data:
  pgfound-pgpartman-data:
  pgfound-replica-data:
